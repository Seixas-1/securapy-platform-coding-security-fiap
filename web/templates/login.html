{% extends "base.html" %}
{% block titulo %}SecuraPy - Login{% endblock %}
{% block conteudo %}
<div class="card" style="max-width:360px; margin: 60px auto;">
    <h2>SecuraPy SIEM</h2>
    {% if erro %}
        <p class="erro">{{ erro }}</p>
    {% endif %}
    <form method="post" action="{{ url_for('processar_login') }}">
        <p><label>Email<br><input type="email" name="email" required autofocus></label></p>
        <p><label>Senha<br><input type="password" name="senha" required></label></p>
        <button type="submit">Entrar</button>
    </form>
</div>
{% endblock %}
